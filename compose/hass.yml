name: hass

networks:
  backend_backend:
    external: true

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /home/starforge/deploy/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /storage/mosquitto/data:/mosquitto/data
      - /storage/mosquitto/log:/mosquitto/log
    networks:
      - backend_backend

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.6.3
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Chicago
      - GAUTH_CLIENT_ID=${GAUTH_CLIENT_ID}
      - GAUTH_CLIENT_SECRET=${GAUTH_CLIENT_SECRET}
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
    volumes:
      - /storage/hass:/config
      - /home/starforge/deploy/config/hass.yml:/config/configuration.yaml:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro

  matter-server:
    image: ghcr.io/matter-js/python-matter-server:8.1.2
    restart: unless-stopped
    # Required for mDNS to work correctly
    network_mode: host
    security_opt:
      # Needed for Bluetooth via dbus
      - apparmor:unconfined
    volumes:
      # Create an .env file that sets the USERDIR environment variable.
      - /storage/matter:/data/
      # Required for Bluetooth via D-Bus
      - /run/dbus:/run/dbus:ro
    # If you adjust command line, make sure to pass the default CMD arguments too:
    #command: --storage-path /data --paa-root-cert-dir /data/credentials --bluetooth-adapter 0

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt
    restart: unless-stopped
    volumes:
      - /storage/z2m/data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      # Frontend port
      - 8080:8080
