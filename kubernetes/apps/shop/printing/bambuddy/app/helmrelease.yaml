apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bambuddy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: bambuddy
  values:
    controllers:
      main:
        strategy: Recreate
        pod:
          terminationGracePeriodSeconds: 30
        containers:
          main:
            image:
              repository: ghcr.io/starforgefoundry/bambuddy
              tag: '1.2.5.7.3'
            env:
              TZ: America/Chicago
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  timeoutSeconds: 5
                  periodSeconds: 10
                  failureThreshold: 3
              readiness: *probes

    defaultPodOptions:
      # Each virtual printer binds its own address on the node's printer VLAN
      # (10.0.60.201, 10.0.60.202), and SSDP discovery only reaches slicers in
      # that broadcast domain.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: shop-server

    service:
      main:
        controller: main
        ports:
          http:
            port: 8000

    route:
      main:
        parentRefs:
          - name: envoy-ingress
            namespace: networking
        hostnames:
          - print.starforgefoundry.com
        rules:
          - backendRefs:
              - identifier: main
                port: 8000

    persistence:
      data:
        existingClaim: bambuddy-data
        globalMounts:
          - path: /app/data
            subPath: data
          - path: /app/logs
            subPath: logs
