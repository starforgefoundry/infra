apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: wiki-js-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  bootstrap:
    initdb:
      database: wiki
      owner: wiki
  storage:
    size: 5Gi
    storageClass: miroir
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
