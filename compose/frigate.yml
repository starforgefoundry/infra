name: frigate

networks:
  backend_backend:
    external: true

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    restart: unless-stopped
    privileged: true
    stop_grace_period: 30s # allow enough time to shut down the various services
    shm_size: "4gb" # update for your cameras based on calculation above
    devices:
      # - /dev/bus/usb:/dev/bus/usb # Passes the USB Coral, needs to be modified for other versions
      # - /dev/apex_0:/dev/apex_0 # Passes a PCIe Coral, follow driver instructions here https://coral.ai/docs/m2/get-started/#2a-on-linux
      # - /dev/video11:/dev/video11 # For Raspberry Pi 4B
      - /dev/dri/renderD128:/dev/dri/renderD128 # For intel hwaccel, needs to be updated for your hardware
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/starforge/deploy/config/frigate.yml:/config/config.yml:ro
      - /storage/frigate:/db
      - /mnt/nvr-storage/frigate:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      - FRIGATE_TAPO_PASSWORD=${FRIGATE_TAPO_PASSWORD}
      - FRIGATE_TAPO_CLOUD_PASSWORD=${FRIGATE_TAPO_CLOUD_PASSWORD}
    ports:
      - "100.121.137.68:5000:5000" # Internal unauthenticated access. Expose carefully.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    networks:
      - backend_backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frigate.rule=Host(`cam.starforgefoundry.com`)"
      - "traefik.http.routers.frigate.middlewares=frigate-oauth"
      - "traefik.http.routers.frigate.entrypoints=websecure"
      - "traefik.http.services.frigate.loadbalancer.server.port=8971"
      - "traefik.http.services.frigate.loadbalancer.server.scheme=https"

  oauth-middleware:
    image: ghcr.io/starforgefoundry/frigate-oauth:latest
    pull_policy: always
    environment:
      - GOOGLE_CLIENT_ID=${GAUTH_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GAUTH_CLIENT_SECRET}
      - SESSION_SECRET=${AUTH_SECRET}
      - CALLBACK_URL=https://cam.starforgefoundry.com/_oauth/callback
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.frigate-oauth.forwardauth.address=http://oauth-middleware:4181"
      - "traefik.http.middlewares.frigate-oauth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.frigate-oauth.forwardauth.authResponseHeaders=X-Forwarded-User,X-Forwarded-Groups"
      - "traefik.http.services.frigate-oauth.loadbalancer.server.port=4181"
    networks:
      - backend_backend
    restart: unless-stopped
