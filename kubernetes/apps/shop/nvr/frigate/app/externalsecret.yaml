apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate
    template:
      data:
        FRIGATE_TAPO_PASSWORD: '{{ .FRIGATE_TAPO_PASSWORD }}'
        FRIGATE_TAPO_CLOUD_PASSWORD: '{{ .FRIGATE_TAPO_CLOUD_PASSWORD }}'
  dataFrom:
    - extract:
        key: frigate
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate-oidc
    template:
      data:
        client-id: '{{ .GAUTH_CLIENT_ID }}'
        client-secret: '{{ .GAUTH_CLIENT_SECRET }}'
  dataFrom:
    - extract:
        key: gauth
