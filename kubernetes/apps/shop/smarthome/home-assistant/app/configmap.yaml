apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-config
  namespace: smarthome
data:
  configuration.yaml: |
    # Loads default set of integrations. Do not remove.
    default_config:

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.0.10.101
        # envoy-ingress runs on the pod network
        - 10.42.0.0/16

    # Load frontend themes from the themes folder
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    zha_toolkit:

    openid:
      client_id: !env_var GAUTH_CLIENT_ID
      client_secret: !env_var GAUTH_CLIENT_SECRET
      configure_url: "https://accounts.google.com/.well-known/openid-configuration"
      username_field: "email"
      scope: "openid profile email"
      block_login: true
      openid_text: "Login with Starforge Google" # Text to display on the login page
      create_user: true
