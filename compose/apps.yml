  protect-oauth:
    image: ghcr.io/starforgefoundry/protect-oauth:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - backend_backend
    environment:
      - GOOGLE_CLIENT_ID=${GAUTH_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GAUTH_CLIENT_SECRET}
      - SESSION_SECRET=${AUTH_SECRET}
      - REDIRECT_URL=https://nvr.starforgefoundry.com/auth/callback
      - UNIFI_HOST="https://10.0.50.244"
      - UNIFI_USERNAME=${PROTECT_STAFF_USERNAME}
      - UNIFI_PASSWORD=${PROTECT_STAFF_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nvr-access.rule=Host(`cam.starforgefoundry.com`)"
      - "traefik.http.routers.nvr-access.entrypoints=websecure"
      - "traefik.http.services.nvr-access.loadbalancer.server.port=8080"

  bambu-connect:
    image: ghcr.io/starforgefoundry/bambu-connect:0.3.5
    restart: unless-stopped
    networks:
      - backend_backend
    environment:
      - AUTH_SECRET=${BAMBU_CONNECT_API_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bambu-connect.rule=Host(`bambu-connect.starforgefoundry.com`)"
      - "traefik.http.routers.bambu-connect.entrypoints=websecure"
      - "traefik.http.services.bambu-connect.loadbalancer.server.port=8000"
