name: misc

networks:
  backend_backend:
    external: true

services:
  printer-subnet-router:
    image: tailscale/tailscale:v1.102.4
    hostname: printer-subnet-router
    healthcheck:
      test: ["CMD-SHELL", "tailscale status"]
      interval: 1s
      timeout: 5s
      retries: 60
    environment:
      - TZ=America/Chicago
      - TS_EXTRA_ARGS=--reset --advertise-routes=10.0.60.0/24
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - /storage/printer-sr:/var/lib/tailscale
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  bwees-subnet-router:
    image: tailscale/tailscale:v1.102.4
    hostname: sf-subnet-router
    healthcheck:
      test: ["CMD-SHELL", "tailscale status"]
      interval: 1s
      timeout: 5s
      retries: 60
    environment:
      - TZ=America/Chicago
      - TS_EXTRA_ARGS=--reset --advertise-routes=10.0.60.0/24
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - /storage/bwees-sr:/var/lib/tailscale
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  bambuddy:
    image: ghcr.io/starforgefoundry/bambuddy:1.2.5.5.2
    # Host network so the printers on the shop LAN show up in discovery and camera streams connect
    network_mode: host
    environment:
      - TZ=America/Chicago
    volumes:
      - /storage/bambuddy/data:/app/data
      - /storage/bambuddy/logs:/app/logs
    stop_grace_period: 30s
    restart: unless-stopped
