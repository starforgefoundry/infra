apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ocirepository.yaml
  - helmrelease.yaml
  - externalsecret.yaml
  - httproute.yaml
  - securitypolicy.yaml
  - pv.yaml
  - pvc.yaml

configMapGenerator:
  - name: frigate-config
    files:
      - config.yml

generatorOptions:
  disableNameSuffixHash: true
