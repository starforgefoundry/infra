apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: orion
spec:
  interval: 1h
  path: ./kubernetes/apps/vps/starforge/orion/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: envoy-gateway
      namespace: networking
    - name: miroir-config
      namespace: storage
    - name: volsync
      namespace: storage
    - name: plugin-barman-cloud
      namespace: operators
    - name: onepassword
      namespace: secrets
  components:
    - ../../../../../components/volsync
  postBuild:
    substitute:
      APP: orion
      VOLSYNC_CLAIM: orion-data
  targetNamespace: starforge
