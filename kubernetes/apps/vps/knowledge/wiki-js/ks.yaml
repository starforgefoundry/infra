apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wiki-js
spec:
  interval: 1h
  path: ./kubernetes/apps/vps/knowledge/wiki-js/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: envoy-gateway
      namespace: networking
    - name: miroir-config
      namespace: storage
    - name: plugin-barman-cloud
      namespace: operators
    - name: onepassword
      namespace: secrets
  targetNamespace: knowledge
