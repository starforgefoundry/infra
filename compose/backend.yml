name: backend

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24

services:
  traefik:
    image: traefik:v3.6.11
    ports:
      - 80:80
      - 443:443
    command:
      - "--configFile=/etc/traefik/config.yml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/bwees/deploy/config/traefik/dynamic:/dynamic
      - /home/bwees/deploy/config/traefik/config.yml:/etc/traefik/config.yml:ro
      - /storage/traefik/certs:/etc/traefik/certs:ro
    networks:
      - backend
    restart: unless-stopped

  frigate-oauth:
    image: ghcr.io/starforgefoundry/frigate-oauth:latest
    pull_policy: always
    environment:
      - GOOGLE_CLIENT_ID=${GAUTH_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GAUTH_CLIENT_SECRET}
      - SESSION_SECRET=${AUTH_SECRET}
      - CALLBACK_URL=https://cam.starforgefoundry.com/_oauth/callback
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.frigate-oauth.forwardauth.address=http://frigate-oauth:4181"
      - "traefik.http.middlewares.frigate-oauth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.frigate-oauth.forwardauth.authResponseHeaders=X-Forwarded-User,X-Forwarded-Groups"
      - "traefik.http.services.frigate-oauth.loadbalancer.server.port=4181"
    networks:
      - backend
    restart: unless-stopped
