name: backend

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24
  traefik:

services:
  traefik:
    image: traefik:v3.6.12
    ports:
      - 80:80
      - 443:443
    command:
      - "--configFile=/etc/traefik/config.yml"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/starforge/deploy/config/traefik/dynamic:/dynamic
      - /home/starforge/deploy/config/traefik/config.yml:/etc/traefik/config.yml:ro
      - /storage/traefik/certs:/etc/traefik/certs:ro
    networks:
      - backend
      - traefik
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    networks:
      - traefik
    restart: unless-stopped

  beszel-agent:
    environment:
      KEY: ${BESZEL_KEY}
      LISTEN: 45876
    image: henrygd/beszel-agent:0.18.6
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
