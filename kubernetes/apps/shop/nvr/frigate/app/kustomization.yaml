apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ocirepository.yaml
  - helmrelease.yaml
  - externalsecret.yaml
  - securitypolicy.yaml
  - pv.yaml
  - pvc.yaml

configMapGenerator:
  - name: frigate-config
    files:
      - config.yml
  - name: frigate-scripts
    files:
      - disable-access-log.sh

generatorOptions:
  disableNameSuffixHash: true
