name: hass

networks:
  backend_backend:
    external: true

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - /home/starforge/deploy/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - /storage/mosquitto/data:/mosquitto/data
      - /storage/mosquitto/log:/mosquitto/log
    networks:
      - backend_backend

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    volumes:
      - /storage/hass:/config
      - /home/starforge/deploy/config/hass.yml:/config/configuration.yaml:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

  matter-server:
    image: ghcr.io/matter-js/python-matter-server:stable
    restart: unless-stopped
    # Required for mDNS to work correctly
    network_mode: host
    security_opt:
      # Needed for Bluetooth via dbus
      - apparmor:unconfined
    volumes:
      # Create an .env file that sets the USERDIR environment variable.
      - /storage/matter:/data/
      # Required for Bluetooth via D-Bus
      - /run/dbus:/run/dbus:ro
    # If you adjust command line, make sure to pass the default CMD arguments too:
    #command: --storage-path /data --paa-root-cert-dir /data/credentials --bluetooth-adapter 0
