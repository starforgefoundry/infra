apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wiki-js
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: wiki-js
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/requarks/wiki
              tag: "2.5.317"
            env:
              DB_TYPE: postgres
              DB_HOST: wiki-js-db-rw
              DB_PORT: "5432"
              DB_NAME:
                valueFrom:
                  secretKeyRef:
                    name: wiki-js-db-app
                    key: dbname
              DB_USER:
                valueFrom:
                  secretKeyRef:
                    name: wiki-js-db-app
                    key: username
              DB_PASS:
                valueFrom:
                  secretKeyRef:
                    name: wiki-js-db-app
                    key: password
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 3000
              readiness: *probes

    service:
      main:
        controller: main
        ports:
          http:
            port: 3000

    route:
      main:
        parentRefs:
          - name: envoy-ingress
            namespace: networking
        hostnames:
          - wiki.starforgefoundry.com
        rules:
          - backendRefs:
              - identifier: main
                port: 3000

    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /wiki/data
