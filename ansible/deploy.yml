- name: Deploy Docker Hosts
  hosts: all
  gather_facts: false
  roles:
    - role: bwees.deploy.deploy_host
      vars:
        host: "{{ inventory_hostname }}"
        deploy_dest: "{{ deployment_location | default('/home/' + ansible_ssh_user + '/deploy') }}"
        compose_src: "../compose/"
        config_src: "../configs/"
        op_secret_uuid: "m5bkirljj5u3hx7cum5aza46py"
        op_secret_vault: "okfgvmcbdlgb5e5dltbgpz4nxe"
        config_mode: "single_host"
        secret_groups:
          - "{{ inventory_hostname }}"
