record:
  enabled: true
  continuous:
    days: 30
  motion:
    days: 90
  alerts:
    retain:
      days: 90
      mode: motion
  detections:
    retain:
      days: 90
      mode: motion

detectors:
  ov:
    type: openvino
    device: GPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

version: 0.18-0
detect:
  enabled: true
  fps: 1
semantic_search:
  enabled: false
  model_size: small
face_recognition:
