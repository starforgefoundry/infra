apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-oauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate-oauth
    template:
      data:
        GOOGLE_CLIENT_ID: '{{ .GAUTH_CLIENT_ID }}'
        GOOGLE_CLIENT_SECRET: '{{ .GAUTH_CLIENT_SECRET }}'
        SESSION_SECRET: '{{ .AUTH_SECRET }}'
  dataFrom:
    - extract:
        key: gauth
    - extract:
        key: frigate-oauth
