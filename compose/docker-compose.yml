services:
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL}
    restart: unless-stopped

  # starboi:
  #   image: ghcr.io/bwees/starboi:latest
  #   volumes:
  #     - /home/bwees/cluster-storage/starboi:/data
  #   environment:
  #     - STARBOI_TOKEN=${STARBOI_TOKEN}
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #   restart: unless-stopped

  bwees-ts:
    image: tailscale/tailscale:v1.86.5
    hostname: starforge-subnet-router
    healthcheck:
      test: ["CMD-SHELL", "tailscale status"]
      interval: 1s
      timeout: 5s
      retries: 60
    environment:
      - TZ=America/New_York
      - TS_EXTRA_ARGS=--reset --advertise-routes=10.0.10.0/23,10.0.20.0/24,10.0.50.0/24
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - /home/starforge/data/bwees-ts:/var/lib/tailscale
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.16.1
    restart: unless-stopped
    privileged: true
    stop_grace_period: 30s # allow enough time to shut down the various services
    shm_size: "512mb" # update for your cameras based on calculation above
    devices:
      # - /dev/bus/usb:/dev/bus/usb # Passes the USB Coral, needs to be modified for other versions
      # - /dev/apex_0:/dev/apex_0 # Passes a PCIe Coral, follow driver instructions here https://coral.ai/docs/m2/get-started/#2a-on-linux
      # - /dev/video11:/dev/video11 # For Raspberry Pi 4B
      - /dev/dri/renderD128:/dev/dri/renderD128 # For intel hwaccel, needs to be updated for your hardware
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/starforge/data/frigate:/config
      - /mnt/nvr/frigate:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    environment:
      - FRIGATE_TAPO_PASSWORD=${FRIGATE_TAPO_PASSWORD}
      - FRIGATE_TAPO_CLOUD_PASSWORD=${FRIGATE_TAPO_CLOUD_PASSWORD}
    ports:
      - "8971:8971"
      - "100.125.29.116:5000:5000" # Internal unauthenticated access. Expose carefully.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    labels:
      - "traefik.http.routers.frigate.rule=Host(`cam.starforgefoundry.com`)"
      - "traefik.http.routers.frigate.middlewares=traefik-forward-auth"
      - "traefik.http.routers.frigate.entrypoints=websecure"
      - "traefik.http.services.frigate.loadbalancer.server.port=8971"
      - "traefik.http.services.frigate.loadbalancer.server.scheme=https"

  traefik:
    image: traefik:v3.5.2
    command: 
    - "--providers.docker"
    - "--entrypoints.websecure.address=:443"
    - "--entrypoints.websecure.http.tls=true"
    - "--serversTransport.insecureSkipVerify=true"


    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  traefik-forward-auth:
    image: thomseddon/traefik-forward-auth:2
    environment:
      - PROVIDERS_OIDC_ISSUER_URL=https://starforgefoundry-0efu3o.us1.zitadel.cloud
      - PROVIDERS_OIDC_CLIENT_ID=${ZITADEL_CLIENT_ID}
      - PROVIDERS_OIDC_CLIENT_SECRET=${ZITADEL_CLIENT_SECRET}
      - DEFAULT_PROVIDER=oidc
      - SECRET=${AUTH_SECRET}
    labels:
      - "traefik.http.middlewares.traefik-forward-auth.forwardauth.address=http://traefik-forward-auth:4181"
      - "traefik.http.middlewares.traefik-forward-auth.forwardauth.authResponseHeaders=X-Forwarded-User,X-Forwarded-Groups"
      - "traefik.http.middlewares.https-endpoint.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.services.traefik-forward-auth.loadbalancer.server.port=4181"
