apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wiki-js-v3
spec:
  interval: 1h
  path: ./kubernetes/apps/vps/knowledge/wiki-js-v3/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: miroir-config
      namespace: storage
    - name: tailscale-operator-proxies
      namespace: networking
  targetNamespace: knowledge
