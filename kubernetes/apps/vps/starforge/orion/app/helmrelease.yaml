apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: orion
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: orion
  values:
    controllers:
      # Pulls the new image onto the node before the upgrade stops the running pod.
      prepull:
        type: job
        annotations:
          helm.sh/hook: pre-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        job:
          backoffLimit: 2
        containers:
          main:
            image: &image
              repository: ghcr.io/starforgefoundry/orion
              tag: 0.34.1
            command: ['node', '-e', '']

      main:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: 'true'
        initContainers:
          migrate:
            image: *image
            command: ['node', 'scripts/migrate.ts']
            env:
              DATABASE_URL: &databaseUrl
                valueFrom:
                  secretKeyRef:
                    name: orion-db-app
                    key: uri
        containers:
          main:
            image: *image
            env:
              DATABASE_URL: *databaseUrl
              ORIGIN: &url https://orion.starforgefoundry.com
              FRONTEND_URL: *url
              # Must be at least the print request upload limit in settings
              BODY_SIZE_LIMIT: 1G
              PUBLIC_PRINT_REQUEST_EMAIL: 3dprint@starforgefoundry.com
              SQUARE_URL: https://connect.squareup.com
            envFrom:
              - secretRef:
                  name: orion
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 1Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 3
              readiness: *probes

    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      main:
        controller: main
        ports:
          http:
            port: 3000

    route:
      main:
        parentRefs:
          - name: envoy-ingress
            namespace: networking
        hostnames:
          - orion.starforgefoundry.com
        rules:
          - backendRefs:
              - identifier: main
                port: 3000

    persistence:
      data:
        existingClaim: orion-data
        advancedMounts:
          main:
            main:
              - path: /data
            migrate:
              - path: /data
