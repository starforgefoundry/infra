mqtt:
  enabled: false

auth:
  enabled: false
  # session_length: 2592000 # 30 days

# envoy-ingress terminates TLS
tls:
  enabled: false

proxy:
  default_role: viewer
  header_map:
    user: x-forwarded-user
    role: x-forwarded-groups
    # envoy sends the Google account email as the role header
    role_map:
      admin:
        - bwees@starforgefoundry.com
  logout_url: /_oauth/logout

database:
  # The path to store the SQLite DB (default: shown below)
  path: /db/frigate.db

# Every camera publishes a main stream for recording and a _sub stream for
# detection. Frigate sizes its decode, motion and shm work off whatever the
# detect stream's native resolution is, so pointing detect at the main stream
# makes it decode 1080p/5MP frames to find a person-sized blob.
