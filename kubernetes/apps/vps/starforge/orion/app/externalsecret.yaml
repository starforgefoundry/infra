apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orion
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: orion
    template:
      data:
        AUTH_SECRET: '{{ .AUTH_SECRET }}'
        GOOGLE_CLIENT_ID: '{{ .GOOGLE_CLIENT_ID }}'
        GOOGLE_CLIENT_SECRET: '{{ .GOOGLE_CLIENT_SECRET }}'
        GOOGLE_SERVICE_ACCOUNT_EMAIL: '{{ .GOOGLE_SERVICE_ACCOUNT_EMAIL }}'
        GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: '{{ .GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}'
        SQUARE_TOKEN: '{{ .SQUARE_TOKEN }}'
        SQUARE_APPLICATION_ID: '{{ .SQUARE_APPLICATION_ID }}'
        SQUARE_WEBHOOK_SIGNATURE_KEY: '{{ .SQUARE_WEBHOOK_SIGNATURE_KEY }}'
        MAILGUN_API_KEY: '{{ .MAILGUN_API_KEY }}'
        FILE_SIGNING_SECRET: '{{ .FILE_SIGNING_SECRET }}'
        GOOGLE_WALLET_ISSUER_ID: '{{ .GOOGLE_WALLET_ISSUER_ID }}'
        GOOGLE_WALLET_CLASS_SUFFIX: '{{ .GOOGLE_WALLET_CLASS_SUFFIX }}'
        APPLE_PASS_TYPE_ID: '{{ .APPLE_PASS_TYPE_ID }}'
        APPLE_TEAM_ID: '{{ .APPLE_TEAM_ID }}'
        APPLE_PASS_CERT: '{{ .APPLE_PASS_CERT }}'
        APPLE_PASS_KEY: '{{ .APPLE_PASS_KEY }}'
        APPLE_WWDR_CERT: '{{ .APPLE_WWDR_CERT }}'
  dataFrom:
    - extract:
        key: orion
