apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: orion-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  bootstrap:
    initdb:
      database: orion
      owner: orion
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: orion-db-r2
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: orion-db-tailscale
              annotations:
                tailscale.com/expose: 'true'
                tailscale.com/hostname: orion-db
  storage:
    size: 5Gi
    storageClass: miroir
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
