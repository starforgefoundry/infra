      - 10.0.10.101:8555
      - 100.125.29.116:8555
      - stun:8555

cameras:
  back_alley_cam:
    enabled: true
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/back_alley_cam
          input_args: preset-rtsp-restream
          roles:
            - record
            - detect

    onvif:
      host: 10.0.50.219
      port: 2020
      user: starforge
      password: "{FRIGATE_TAPO_PASSWORD}"

    motion:
      mask: 0.365,0.055,0,0.053,0,0,0.365,0
