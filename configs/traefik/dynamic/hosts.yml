http:
  routers:
    starforge-hass:
      rule: "Host(`hass.starforgefoundry.com`)"
      service: starforge-hass
      entryPoints:
        - web
        - websecure

    starforge-bambuddy:
      rule: "Host(`print.starforgefoundry.com`)"
      service: starforge-bambuddy
      entryPoints:
        - web
        - websecure

  services:
    starforge-hass:
      loadBalancer:
        servers:
          # Tailscale IP, not the DHCP lease, so a new lease can't break the route
          - url: "http://100.121.137.68:8123"

    starforge-bambuddy:
      loadBalancer:
        servers:
          - url: "http://100.121.137.68:8000"
