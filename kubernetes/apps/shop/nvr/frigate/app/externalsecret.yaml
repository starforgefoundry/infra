apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: frigate
    template:
      data:
        FRIGATE_TAPO_PASSWORD: '{{ .FRIGATE_TAPO_PASSWORD }}'
        FRIGATE_TAPO_CLOUD_PASSWORD: '{{ .FRIGATE_TAPO_CLOUD_PASSWORD }}'
  dataFrom:
    - extract:
        key: frigate
