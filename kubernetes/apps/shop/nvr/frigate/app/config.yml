    #   - tapo://{FRIGATE_TAPO_CLOUD_PASSWORD}@10.0.50.219

    # ---- Hiseeu wireless NVR @ 10.0.50.46 ----
    # chN_M.264 -> N = channel number - 1 (zero based), M = 0 main / 1 sub
    # Note port 80, not 554.
    #
    # The NVR cannot keep up when several clients pull 2880x1620 at once: a
    # main stream measured 0.22x realtime under load while its 800x448 sub
    # measured 1.11x on the same connection.
    dumpster_cam:
      - rtsp://admin:password@10.0.50.46:80/ch0_0.264
    dumpster_cam_sub:
      - rtsp://admin:password@10.0.50.46:80/ch0_1.264
    storefront_garage_cam:
      - rtsp://admin:password@10.0.50.46:80/ch1_0.264
    storefront_garage_cam_sub:
      - rtsp://admin:password@10.0.50.46:80/ch1_1.264
    building_side_cam:
      - rtsp://admin:password@10.0.50.46:80/ch2_0.264
    building_side_cam_sub:
      - rtsp://admin:password@10.0.50.46:80/ch2_1.264

    # wireless_nvr_3:
    #   - rtsp://admin:password@10.0.50.46:80/ch3_0.264
    back_pad_cam:
      - rtsp://admin:password@10.0.50.46:80/ch4_0.264
    back_pad_cam_sub:
      - rtsp://admin:password@10.0.50.46:80/ch4_1.264
    side_pad_cam:
      - rtsp://admin:password@10.0.50.46:80/ch5_0.264
    side_pad_cam_sub:
      - rtsp://admin:password@10.0.50.46:80/ch5_1.264
    shop_cam:
      - rtsp://admin:password@10.0.50.46:80/ch6_0.264
    shop_cam_sub:
      - rtsp://admin:password@10.0.50.46:80/ch6_1.264
    treeline_camera:
      - rtsp://admin:password@10.0.50.46:80/ch7_0.264
    treeline_camera_sub:
      - rtsp://admin:password@10.0.50.46:80/ch7_1.264

  webrtc:
    candidates:
      - 10.0.10.206:8555
      - 100.121.137.68:8555
      - stun:8555

