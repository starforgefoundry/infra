apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: home-assistant
    template:
      data:
        GAUTH_CLIENT_ID: '{{ .GAUTH_CLIENT_ID }}'
        GAUTH_CLIENT_SECRET: '{{ .GAUTH_CLIENT_SECRET }}'
  dataFrom:
    - extract:
        key: gauth
