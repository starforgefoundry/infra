---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-db
  namespace: nvr
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: miroir
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-recordings
  namespace: nvr
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ''
  volumeName: frigate-recordings
  resources:
    requests:
      storage: 10Ti
