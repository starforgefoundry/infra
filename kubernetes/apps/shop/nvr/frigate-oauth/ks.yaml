apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: frigate-oauth
spec:
  interval: 1h
  path: ./kubernetes/apps/shop/nvr/frigate-oauth/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword
      namespace: secrets
  targetNamespace: nvr
