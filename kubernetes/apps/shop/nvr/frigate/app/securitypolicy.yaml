---
# Google login in front of Frigate. The ID token's email becomes both the user
# and the role header; Frigate's proxy.role_map turns the email into a role.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: frigate-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: frigate
  oidc:
    provider:
      issuer: https://accounts.google.com
      # Google only issues a refresh token with access_type=offline
      authorizationEndpoint: https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent
    clientIDRef:
      name: frigate-oidc
    clientSecret:
      name: frigate-oidc
    scopes:
      - openid
      - email
    # Already registered on the Google OAuth client
    redirectURL: https://cam.starforgefoundry.com/_oauth/callback
    logoutPath: /_oauth/logout
    refreshToken: true
    defaultRefreshTokenTTL: 2160h
    cookieNames:
      idToken: frigate-id-token
      accessToken: frigate-access-token
    forwardIDToken:
      header: x-frigate-id-token
  jwt:
    providers:
      - name: google
        issuer: https://accounts.google.com
        remoteJWKS:
          uri: https://www.googleapis.com/oauth2/v3/certs
        extractFrom:
          headers:
            - name: x-frigate-id-token
        claimToHeaders:
          - claim: email
            header: x-forwarded-user
          - claim: email
            header: x-forwarded-groups
  authorization:
    defaultAction: Deny
    rules:
      - name: workspace-accounts
        action: Allow
        principal:
          jwt:
            provider: google
            claims:
              - name: hd
                values:
                  - starforgefoundry.com
