apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bwees-subnet-router
spec:
  interval: 1h
  path: ./kubernetes/apps/shop/networking/bwees-subnet-router/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: miroir-config
      namespace: storage
    - name: volsync
      namespace: storage
    - name: onepassword
      namespace: secrets
  components:
    - ../../../../../components/volsync
  postBuild:
    substitute:
      APP: bwees-subnet-router
      VOLSYNC_CLAIM: bwees-subnet-router-state
      VOLSYNC_UID: '0'
      VOLSYNC_GID: '0'
  targetNamespace: networking
