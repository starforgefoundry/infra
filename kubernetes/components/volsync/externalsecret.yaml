---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-restic-r2
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${APP}-restic-r2
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: '{{ .repository }}/${CLUSTER}/${APP}'
        RESTIC_PASSWORD: '{{ .repo_password }}'
        AWS_ACCESS_KEY_ID: '{{ .access_key_id }}'
        AWS_SECRET_ACCESS_KEY: '{{ .secret_access_key }}'
  dataFrom:
    - extract:
        key: restic-r2
