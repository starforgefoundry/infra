---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: starforgefoundry-com-tls
  namespace: networking
spec:
  secretName: starforgefoundry-com-tls
  dnsNames:
    - 'starforgefoundry.com'
    - '*.starforgefoundry.com'
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
